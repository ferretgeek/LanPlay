# 本机友好构建：限制常驻内存、并发和 JVM 可见 CPU，避免 Win11 前台卡顿。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# 项目路径含中文「局域网SMB播放器」，AGP 默认会拒绝构建。
# 第 1 阶段无 NDK，aapt2/d8 对 UTF-8 路径支持正常，故放行。
# 第 4 阶段引入 libVLC（NDK）时若出问题，再把工程迁到纯 ASCII 路径。
android.overridePathCheck=true

kotlin.code.style=official

# Compose Strong Skipping 在 Kotlin 2.0+ 默认开启，此处不再重复声明

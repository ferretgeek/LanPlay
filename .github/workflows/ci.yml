name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LanPlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2

  scraper:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lanplay-scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lanplay-scraper/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run scraper tests
        run: python -m unittest -v
